name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Planted fixtures and checked examples
        run: python3 verify/check.py --selftest
      - name: Every published run
        run: python3 verify/check.py --matrix
